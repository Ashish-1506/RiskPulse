# ==============================================================================
# RiskPulse Wholesale Banking Stress Testing Scenarios
# Baseline shocks calibrated at maximum severity (impact_score = 10.0).
# In production, every shock is scaled by severity = (impact_score / 10.0).
# NOTE: Every value in this file is an illustrative empirical assumption for hackathon demonstration.
# ==============================================================================

scenarios:
  Geopolitical:
    name: "Geopolitical Conflict & Sanctions"
    description: "Military conflict, trade embargoes, and regional airspace/maritime blockades. (Illustrative assumption)"
    equity: -0.12                # -12% broad equity drawdown (Illustrative assumption)
    rates_bps: -30.0             # -30 bps flight-to-safety decline in benchmark sovereign yields (Illustrative assumption)
    spread_bps: 120.0            # +120 bps credit spread widening (Illustrative assumption)
    fx_em: -0.08                 # -8% EM currency depreciation vs USD (Illustrative assumption)
    fx_usd: 0.02                 # +2% USD safe-haven appreciation (Illustrative assumption)
    commodity: 0.15              # +15% crude oil and commodity price spike (Illustrative assumption)
    pd_multiplier: 1.5           # 1.5x multiplier on 1-year probability of default (Illustrative assumption)
    affected_sector_only: false
    affected_region_only: false

  Macroeconomic:
    name: "Macroeconomic Stagflation & Recession"
    description: "Deep GDP contraction, high CPI inflation, and rising unemployment. (Illustrative assumption)"
    equity: -0.10                # -10% equity decline (Illustrative assumption)
    rates_bps: 200.0             # +200 bps yield curve shift from inflation premiums (Illustrative assumption)
    spread_bps: 80.0             # +80 bps credit spread widening (Illustrative assumption)
    fx_em: -0.03                 # -3% EM currency depreciation vs USD (Illustrative assumption)
    fx_usd: 0.01                 # +1% USD appreciation (Illustrative assumption)
    commodity: -0.05             # -5% demand destruction decline in commodities (Illustrative assumption)
    pd_multiplier: 1.3           # 1.3x baseline PD multiplier (Illustrative assumption)
    affected_sector_only: false
    affected_region_only: false

  Monetary Policy:
    name: "Aggressive Monetary Tightening"
    description: "Central bank delivers unexpected 100 bps policy rate hike. (Illustrative assumption)"
    equity: -0.06                # -6% valuation contraction (Illustrative assumption)
    rates_bps: 100.0             # +100 bps shift across money market and benchmark rates (Illustrative assumption)
    spread_bps: 40.0             # +40 bps spread expansion (Illustrative assumption)
    fx_em: -0.02                 # -2% EM depreciation (Illustrative assumption)
    fx_usd: 0.02                 # +2% USD appreciation (Illustrative assumption)
    commodity: 0.00              # Flat commodity response (Illustrative assumption)
    pd_multiplier: 1.15          # 1.15x higher refinancing default risk (Illustrative assumption)
    affected_sector_only: false
    affected_region_only: false

  Credit Event:
    name: "Major Corporate Default & Debt Restructuring"
    description: "High-profile Chapter 11 bankruptcy or rating downgrade to CCC junk. (Illustrative assumption)"
    equity: -0.08                # -8% sector equity slump (Illustrative assumption)
    rates_bps: -10.0             # -10 bps flight to safety (Illustrative assumption)
    spread_bps: 250.0            # +250 bps spread blowout for affected sector (Illustrative assumption)
    fx_em: 0.00                  # Neutral FX (Illustrative assumption)
    fx_usd: 0.00                 # Neutral FX (Illustrative assumption)
    commodity: 0.00              # Neutral commodity (Illustrative assumption)
    pd_multiplier: 2.5           # 2.5x PD surge for affected sector (Illustrative assumption)
    affected_sector_only: true   # Spread and PD shocks applied primarily to affected sector
    affected_region_only: false

  Natural Disaster:
    name: "Catastrophic Natural Disaster"
    description: "Category 5 hurricane, tsunami, or earthquake damaging key production hubs. (Illustrative assumption)"
    equity: -0.04                # -4% equity drawdown (Illustrative assumption)
    rates_bps: 0.0               # 0 bps neutral interest rate shock (Illustrative assumption)
    spread_bps: 60.0             # +60 bps spread widening for affected region (Illustrative assumption)
    fx_em: -0.02                 # -2% regional currency weakness (Illustrative assumption)
    fx_usd: 0.00                 # Neutral USD (Illustrative assumption)
    commodity: 0.10              # +10% supply disruption commodity jump (Illustrative assumption)
    pd_multiplier: 1.3           # 1.3x PD multiplier in affected region (Illustrative assumption)
    affected_sector_only: false
    affected_region_only: true   # Shocks applied primarily to affected country/region

  Cyber/Operational:
    name: "Critical Infrastructure Cyber Attack"
    description: "Sophisticated ransomware disabling clearing house, pipeline, or payment network. (Illustrative assumption)"
    equity: -0.05                # -5% equity drawdown (Illustrative assumption)
    rates_bps: 0.0               # 0 bps rate shock (Illustrative assumption)
    spread_bps: 50.0             # +50 bps credit spread widening (Illustrative assumption)
    fx_em: 0.00                  # Neutral FX (Illustrative assumption)
    fx_usd: 0.00                 # Neutral FX (Illustrative assumption)
    commodity: 0.00              # Neutral commodity (Illustrative assumption)
    pd_multiplier: 1.2           # 1.2x operational default multiplier (Illustrative assumption)
    affected_sector_only: false
    affected_region_only: false
