# ------------------------------------------------------------------------------
# Data Ingestion Sources & Settings
# ------------------------------------------------------------------------------
sources:
  gdelt:
    enabled: true
    query_url: "https://api.gdeltproject.org/api/v2/doc/doc"
    max_records: 50
    timespan: "24h"
    timeout_sec: 10
  rss:
    enabled: true
    timeout_sec: 8
    feeds:
      - name: "Yahoo Finance Top Stories"
        url: "https://finance.yahoo.com/news/rssindex"
        source_type: "news"
      - name: "CNBC Finance"
        url: "https://search.cnbc.com/rs/search/combinedlist/view.xml?partnerId=wrss01&id=10000664"
        source_type: "news"
      - name: "SEC Press Releases"
        url: "https://www.sec.gov/news/pressreleases.rss"
        source_type: "news"
  newsapi:
    enabled: false  # Auto-enabled if NEWSAPI_KEY environment variable is present
    page_size: 25
  social:
    replay_file: "data/tweets_sample.jsonl"
    replay_speed_multiplier: 1.0
    reddit_enabled: false
    stocktwits_enabled: false

# ------------------------------------------------------------------------------
# Sentiment Analysis Engine
# ------------------------------------------------------------------------------
sentiment:
  backend: "finbert"            # Options: 'finbert' | 'vader'
  model_name: "ProsusAI/finbert"
  neutral_band: 0.15           # Sentiment scores within [-0.15, 0.15] are tagged NEUTRAL
  batch_size: 16
  max_length: 128
  device: "cpu"                # 'cpu' or 'cuda'

# ------------------------------------------------------------------------------
# Multi-Factor Impact Scoring Model
# impact_score = 1.0 + 9.0 * [w_prior*event + w_sent*|sentiment| + w_kw*keywords + w_src*credibility + w_corr*corroboration]
# ------------------------------------------------------------------------------
impact:
  weights:
    event_prior: 0.40
    sentiment: 0.25
    keywords: 0.15
    source: 0.10
    corroboration: 0.10
  source_credibility:
    reuters: 1.00
    bloomberg: 1.00
    ft: 0.95
    sec_gov: 1.00
    cnbc: 0.85
    yahoo_finance: 0.80
    gdelt: 0.75
    newsapi: 0.70
    reddit: 0.45
    stocktwits: 0.45
    twitter: 0.40
    unknown: 0.50

# ------------------------------------------------------------------------------
# Module B: Wholesale Banking Stress-Testing
# ------------------------------------------------------------------------------
stress:
  trigger_threshold: 7.0       # Only events with impact_score >= 7.0 trigger stress evaluation
  severity_scale: "impact/10"   # Linear factor scaling from 0.7 to 1.0
  exposure_link_bonus: 0.5     # Additional impact boost when direct portfolio counterparty hit

# ------------------------------------------------------------------------------
# Module A: Tactical Rebalancing Engine
# ------------------------------------------------------------------------------
rebalancer:
  alpha: 0.5                   # Sensitivity factor of sentiment to weight shift
  kappa: 1.0                   # Normalization constant
  decay_lambda_per_hour: 0.05  # Exponential time-decay rate for old signals
  min_weight: 0.01             # Minimum position bound (1%)
  max_weight: 0.15             # Maximum position bound (15%)
  turnover_cap: 0.10           # Maximum allowed one-period total portfolio turnover (10%)
  no_trade_band: 0.0025        # Trades smaller than 25 bps are ignored to limit friction
  social_weight: 0.60          # Discount factor for social signals vs news
  cost_bps: 10.0               # Transaction friction in bps per unit turnover

