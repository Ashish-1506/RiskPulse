# ==============================================================================
# RiskPulse Central Configuration
# All model parameters, ticker universes, weights, and ingestion thresholds.
# ZERO magic numbers in application code.
# ==============================================================================

app:
  name: "RiskPulse"
  version: "0.1.0"
  env: "development"
  log_level: "INFO"

